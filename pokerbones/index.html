  text-shadow: 0 2px 0 rgba(0,0,0,.4);
}
.logo em, h1 em { color: var(--gold); font-style: normal; text-shadow: 0 0 14px rgba(244,198,76,.4); }
.logoimg { height: clamp(34px, 9vw, 48px); width: auto; display: block;
  filter: drop-shadow(0 2px 4px rgba(0,0,0,.45)); }
.dlogo.logoimg { height: clamp(42px, 5vw, 60px); }
.ruleslogo { display: block; margin: -6px auto 6px; height: clamp(96px, 26vw, 132px);
  width: auto; filter: drop-shadow(0 3px 8px rgba(0,0,0,.5)); }
.info {
  width: clamp(30px,7.5vw,40px); aspect-ratio: 1;
  border-radius: 50%;
  border: 2px solid var(--muted);
  background: rgba(0,0,0,.18);
  color: var(--muted);
  font-size: clamp(16px,4.2vw,22px);
  font-weight: 700;
}
.bank {
  margin-left: auto;
  font-family: var(--cf);
  font-weight: 700;
  font-size: clamp(22px,5.8vw,36px);
  color: var(--gold);
  text-shadow: 0 0 12px rgba(244,198,76,.35);
}

/* ─── BOARD: left rail (deck/draw/score) + 3 card columns, aligned via grid ─── */
.board {
  flex: 0 0 auto;
  display: grid;
  grid-template-columns: repeat(4, var(--colw));
  grid-template-rows: auto auto auto auto auto;
  justify-content: center;
  align-content: center;
  gap: clamp(1px,0.3dvh,3.5px) var(--colgap);
  --colgap: clamp(10px,3.4vw,24px);
  --colw: calc(var(--cardw) + clamp(10px,2.4vw,18px));
}
.railcell { display: flex; align-items: center; justify-content: center; }
/* total score sits in-line with the column scores; its SCORE label floats
   toward the outer edge (out of flow) so it never offsets the box */
.railscore { position: relative; flex-direction: column; justify-content: center; gap: 0; }
.railscore .collabel { position: absolute; left: 0; right: 0; bottom: 100%; margin-bottom: 3px; }
.railcards { position: relative; }
/* line the rail deck/draw up with the column cards: player to the top,
   dealer to the bottom (rather than centered in the row) */
.railcards.you { align-items: flex-start; }
.railcards.en  { align-items: flex-end; }
.rdd { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(3px,0.9dvh,9px); }

/* deck */
.deck { display: flex; flex-direction: column; align-items: center; gap: clamp(3px,0.8dvh,7px); cursor: pointer; }

.deckpile {
  position: relative;
  width: var(--draww);
  height: var(--drawh);
}
/* a single real face-down card back (pack art), no splay */
.pcard {
  position: absolute; inset: 0;
  border-radius: clamp(4px,1.2vw,8px);
  background-image: var(--card-back);
  background-size: cover; background-position: center;
  background-repeat: no-repeat;
  background-color: #14304a;
}
.pcard.top { box-shadow: 0 4px 10px rgba(0,0,0,.55); }
/* our own red (dealer) / blue (you) striped card backs */
.deckpile.a .pcard {
  background:
    repeating-linear-gradient(45deg, rgba(0,0,0,.20) 0 6px, transparent 6px 12px),
    linear-gradient(135deg, #8a2c22, #5a1c16);
  border: 2px solid #e8c98a;
}
.deckpile.p .pcard {
  background:
    repeating-linear-gradient(45deg, rgba(255,255,255,.12) 0 6px, transparent 6px 12px),
    linear-gradient(135deg, #1f4e78, #102b45);
  border: 2px solid #cfe0ef;
}
.deckpile.drew .pcard.top { animation: decknudge .3s ease-out; }
@keyframes decknudge {
  0%   { transform: translate(0,0) rotate(0); }
  35%  { transform: translate(5px,-7px) rotate(4deg); }
  100% { transform: translate(0,0) rotate(0); }
}
.deckcount {
  position: absolute; right: -7px; bottom: -7px; z-index: 4;
  min-width: clamp(22px,5.6vw,32px); height: clamp(22px,5.6vw,32px);
  padding: 0 4px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 999px;
  font-family: var(--cf); font-weight: 700;
  font-size: clamp(12px,3.3vw,18px);
  color: #1a1408; background: var(--gold);
  box-shadow: 0 2px 6px rgba(0,0,0,.5);
}

/* deck + draw inside the rail — never compress; keep exact card dimensions */
.deck { gap: clamp(2px,0.6dvh,5px); flex: 0 0 auto; }
.drawhold { display: flex; flex-direction: column; align-items: center; gap: clamp(2px,0.6dvh,5px); flex: 0 0 auto; }
.deckpile, .slot.draw, .drawfly { flex: 0 0 auto; }
.slot.draw { width: var(--draww); height: var(--drawh); }

/* ─── BOTTOM BAR: BET · turn prompt · PAYOUT ─── */
.botbar {
  flex: 0 0 auto;
  display: flex; align-items: stretch; justify-content: center;
  gap: clamp(5px,2vw,12px);
}
.botbox {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: clamp(4px,0.9dvh,9px) clamp(8px,2.4vw,16px);
  border-radius: 10px; min-width: clamp(64px,17vw,108px);
}
.botbox .botlabel { font-family: var(--cf); font-weight: 700; font-size: clamp(10px,2.8vw,15px); letter-spacing: 1px; color: var(--muted); }
.botbox b { font-family: var(--cf); font-weight: 700; font-size: clamp(20px,5.6vw,32px); line-height: 1; }
.botbox.bet { background: rgba(0,0,0,.26); border: 1px solid rgba(255,255,255,.12); }
.botbox.bet b { color: var(--text); }
.botbox.payout { background: linear-gradient(180deg, rgba(13,40,35,.92), rgba(7,26,22,.92)); border: 1.5px solid var(--gold); }
.botbox.payout .botlabel { color: var(--gold-soft); }
.botbox.payout b { color: var(--gold); text-shadow: 0 0 10px rgba(244,198,76,.5); }

/* the turn-prompt banner — flat ends so it reads as a banner, not a button */
.tapbanner {
  flex: 1 1 auto;
  display: flex; align-items: center; justify-content: center;
  text-align: center;
  font-family: var(--cf); font-weight: 700;
  font-size: clamp(14px,3.8vw,22px);
  letter-spacing: 2px;
  color: var(--muted);
  padding: clamp(4px,0.9dvh,9px) 10px;
  border-radius: 3px;
  background: rgba(0,0,0,.22);
  border-top: 1px solid rgba(255,255,255,.1);
  border-bottom: 1px solid rgba(255,255,255,.1);
}
.tapbanner.mine {
  color: #2a1c05;
  background: linear-gradient(180deg, var(--gold-soft), var(--gold));
  border-color: var(--gold-soft);
  animation: tappulse 1.2s ease-in-out infinite;
}
@keyframes tappulse {
  0%,100% { box-shadow: 0 0 12px rgba(244,198,76,.3); }
  50%     { box-shadow: 0 0 26px rgba(244,198,76,.75); }
}

/* Rail labels stack the owner over the noun on two lines, so the type is bigger */
.collabel { position: relative; z-index: 6; font-family: var(--cf); font-weight: 700; color: var(--muted); line-height: .98; text-align: center; display: inline-flex; flex-direction: column; align-items: center; gap: 1px; }
.collabel .lprefix { font-size: clamp(11px,3vw,16px); letter-spacing: .5px; opacity: .9; }
.collabel .lnoun   { font-size: clamp(15px,4.2vw,22px); letter-spacing: 1px; }
/* vertical variant — two side-by-side columns of rotated text */
.collabel.vlabel { flex-direction: row; gap: 1px; align-items: center; line-height: 1; }
.collabel.vlabel .lprefix, .collabel.vlabel .lnoun { writing-mode: vertical-rl; transform: rotate(180deg); letter-spacing: .5px; }
.collabel.vlabel .lprefix { font-size: clamp(9px,2.4vw,12px); }
.collabel.vlabel .lnoun   { font-size: clamp(11px,3vw,15px); }
.collabel.en   { color: var(--en-line); }
.collabel.you  { color: var(--you-line); }
.collabel.gold { color: var(--gold-soft); }

/* TOTAL score — same visual language AND height as the column scores */
.scorebox {
  position: relative;
  align-self: center;
  isolation: isolate;                    /* trap the flame layer below the external SCORE label */
  display: flex; align-items: center; justify-content: center;
  height: var(--scoreh);                 /* identical box to the column scores */
  width: 100%;
  padding: 0 2px;
  border-radius: 10px;
  min-width: 0;
  border-bottom: 3px solid var(--gold-dim);
  overflow: visible;
}
.scorebox.en  { background: var(--en-panel); }
.scorebox.you { background: var(--you-panel); }
.scorebox b { position: relative; z-index: 1; font-family: var(--cf); font-weight: 700; font-size: clamp(22px,5.6vw,32px); line-height: 1; color: var(--text); }

/* leading total: gold number on a DARK halo (not gold-on-gold) so it stays legible */
.scorebox.winning { border-bottom-color: var(--gold); box-shadow: 0 0 16px rgba(244,198,76,.4); }
.scorebox.winning b { color: var(--gold); text-shadow: 0 0 5px rgba(0,0,0,.85), 0 1px 2px rgba(0,0,0,.9); }

/* ── WINNING ADORNMENT: rotating sunrays behind the box + a floating crown ── */
.scorewrap { position: relative; width: 100%; display: flex; align-items: center; justify-content: center; }
.sunrays {
  position: absolute; left: 50%; top: 50%; z-index: 0;
  width: 207%; aspect-ratio: 1;
  transform: translate(-50%, -50%);
  pointer-events: none;
  background: repeating-conic-gradient(from 0deg at 50% 50%,
    rgba(255,210,90,.55) 0deg 9deg, transparent 9deg 22deg);
  -webkit-mask-image: radial-gradient(circle, #000 18%, rgba(0,0,0,.5) 42%, transparent 70%);
          mask-image: radial-gradient(circle, #000 18%, rgba(0,0,0,.5) 42%, transparent 70%);
  animation: sunspin 10.35s linear infinite;
}
@keyframes sunspin { to { transform: translate(-50%, -50%) rotate(360deg); } }
.crown {
  position: absolute; left: 50%; bottom: 100%; z-index: 5;
  transform: translateX(-50%);
  width: clamp(30px,8vw,48px);
  margin-bottom: -2px;
  pointer-events: none;
  filter: drop-shadow(0 2px 3px rgba(0,0,0,.55));
  animation: crownbob 1.8s ease-in-out infinite;
}
.crown .crownsvg { width: 100%; height: auto; display: block; }
@keyframes crownbob {
  0%,100% { transform: translateX(-50%) translateY(0) rotate(-2deg); }
  50%     { transform: translateX(-50%) translateY(-4px) rotate(2deg); }
}
/* On height-constrained (landscape/desktop) layouts the board is sized by
   dvh while the crown's 8vw width saturates to its max — oversizing it so it
   pokes up into the deck pile + count badge that sit right above the player
   score. Tame the width (no longer vw-driven) and tuck the crown onto the
   box top so it clears the badge. Phone-portrait keeps the floating crown. */
@media (min-aspect-ratio: 2/3) {
  .crown {
    width: clamp(22px, 3.6vw, 30px);
    margin-bottom: calc(var(--scoreh) * -0.16);
  }
}
/* Both SCORE labels sit above their box, so a winning crown can't float above
   without colliding with the label — perch it on the box's top edge instead
   (still clear of the number). */
.railscore .crown {
  bottom: auto;
  top: 2px;
  margin-bottom: 0;
  width: clamp(24px, 6vw, 32px);
}

/* ─── COLUMN SCORES ─── */
.colscore {
  position: relative;
  align-self: center;
  height: var(--scoreh);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center;
  border-radius: 10px;
  padding: 0 2px;
  border-bottom: 3px solid var(--gold-dim);
  line-height: 1;
}
.colscore.en  { background: var(--en-panel); }
.colscore.you { background: var(--you-panel); }
.colscore b { display: block; font-family: var(--cf); font-weight: 700; font-size: clamp(22px,5.6vw,32px); color: var(--text); }
.colscore span { display: block; font-family: var(--cf); font-weight: 700; font-size: clamp(11px,3vw,16px); letter-spacing: .4px; color: var(--gold); margin-top: 1px; }
.colscore.lead { border-bottom-color: var(--gold); box-shadow: 0 0 14px rgba(244,198,76,.35); }
/* dark halo (not gold-on-gold) keeps the gold number crisp */
.colscore.lead b { color: var(--gold); text-shadow: 0 0 4px rgba(0,0,0,.85), 0 1px 2px rgba(0,0,0,.9); }

/* + between adjacent column scores, = between the last column and the total */
.scoreop {
  position: absolute;
  left: calc(100% + var(--colgap) / 2);
  top: 50%;
  transform: translate(-50%, -50%);
  z-index: 6;
  pointer-events: none;
  font-family: var(--cf); font-weight: 700;
  font-size: clamp(15px,4.4vw,24px);
  line-height: 1;
  color: var(--gold-soft);
  opacity: .85;
  text-shadow: 0 1px 2px rgba(0,0,0,.6);
}

/* ─── ACTIVE-TURN DIMMING: fade the side that isn't acting ─── */
/* Cards being destroyed (dying / attack victims) and a hand callout stay
   full-strength; resting cards, the deck/draw, AND the scores fade. We dim the
   cards per-card (not the .half container) so a child can opt out — a parent
   opacity would cap every child and we couldn't keep the victims bright.
   Scores have no such opt-outs, so we dim those containers directly. */
.half, .cardv, .railcards, .colscore, .railscore { transition: opacity .3s ease, filter .3s ease, background .3s ease, border-color .3s ease; }

.board.turn-you .half.dealer .cardv:not(.dying):not(.atk-victim),
.board.turn-en  .half.mine   .cardv:not(.dying):not(.atk-victim),
.board.turn-you .railcards.en,
.board.turn-en  .railcards.you,
.board.turn-you .colscore.en,
.board.turn-you .railscore.en,
.board.turn-en  .colscore.you,
.board.turn-en  .railscore.you {
  opacity: .5;
  filter: saturate(.66);
}
/* dim the empty frame of the inactive side too (so it reads as off-turn before
   cards land) — frame colours only, and never over a destruction flash / glow */
.board.turn-you .half.dealer:not(.hit):not(.glow) { background: rgba(90,34,28,.16); border-color: rgba(228,113,95,.4); }
.board.turn-en  .half.mine:not(.hit):not(.glow)   { background: rgba(23,58,92,.18); border-color: rgba(90,166,224,.4); }

/* ─── TURN TOAST (center screen) ─── */
.turntoast {
  position: fixed; left: 50%; top: 50%;
  transform: translate(-50%, -50%);
  z-index: 60;
  pointer-events: none;
  font-family: var(--cf); font-weight: 700;
  font-size: clamp(38px, 13vw, 84px);
  letter-spacing: 3px;
  white-space: nowrap;
  text-align: center;
  animation: turntoast 1.15s cubic-bezier(.2,.8,.3,1) forwards;
}
/* render over the DIMMED (inactive) side: your turn → over the dealer's top half;
   dealer's turn → over your dimmed bottom half */
.turntoast.you { top: 33%; color: var(--gold); text-shadow: 0 0 18px rgba(244,198,76,.55), 0 3px 6px rgba(0,0,0,.6); }
.turntoast.en  { top: 67%; color: var(--en-line); text-shadow: 0 0 18px var(--en-glow), 0 3px 6px rgba(0,0,0,.6); }
@keyframes turntoast {
  0%   { opacity: 0; transform: translate(-50%, -50%) scale(.72); }
  16%  { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  72%  { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  100% { opacity: 0; transform: translate(-50%, -50%) scale(1.06); }
}

.colmid {
  text-align: center;
  font-family: var(--cf); font-weight: 700;
  font-size: clamp(13px,3.4vw,18px);
  letter-spacing: 1px;
  color: var(--muted);
  line-height: 1;
}

.half {
  position: relative;
  width: 100%;
  display: flex; flex-direction: column; align-items: center;
  gap: clamp(2px,0.7dvh,7px);
  padding: clamp(2px,0.6dvh,6px);
  border-radius: 13px;
  border: 2px solid;
  transition: border-color .15s, background .15s, box-shadow .2s;
}
.half.dealer { background: rgba(90,34,28,.36); border-color: var(--en-line); }
.half.mine   { background: rgba(23,58,92,.38); border-color: var(--you-line); }
.half.mine.tappable {
  border-color: var(--gold);
  background: rgba(47,116,171,.46);
  cursor: pointer;
  animation: colpulse 1.2s ease-in-out infinite;
}
/* destruction flash — legible on each board's own colour: gold burst when you
   smash the dealer's RED board, red alarm when the dealer smashes your blue one */
.half.dealer.hit { background: rgba(255,226,140,.6); border-color: #fff; box-shadow: 0 0 24px rgba(255,226,140,.75); }
.half.mine.hit   { background: rgba(224,60,50,.5);  border-color: #ff6f62; box-shadow: 0 0 22px rgba(224,60,50,.55); }
@keyframes colpulse {
  0%, 100% { border-color: rgba(244,198,76,.95); }
  50%      { border-color: rgba(244,198,76,.4); }
}

/* hand-formed glow + banner, escalating by tier */
.half.glow.t1 { border-color: var(--gold); box-shadow: 0 0 12px rgba(244,198,76,.5); }
.half.glow.t2 { border-color: var(--gold); box-shadow: 0 0 18px rgba(244,198,76,.7); }
.half.glow.t3 { border-color: #ffd97a; box-shadow: 0 0 24px rgba(255,217,122,.9); }
.half.glow.t4 { border-color: #ffe9b0; box-shadow: 0 0 32px rgba(255,233,176,.97); }
.half.glow.t5 { border-color: #fff; box-shadow: 0 0 40px rgba(255,255,255,.97), 0 0 70px rgba(244,198,76,.85); }

.half .slot, .half .cardv { width: var(--cardw); height: var(--cardh); }
.slot { border: 2px dashed; border-radius: 9px; }
.half.dealer .slot { border-color: rgba(228,113,95,.5); background: rgba(90,34,28,.3); }
.half.mine   .slot { border-color: rgba(90,166,224,.5); background: rgba(23,58,92,.3); }

.handpop {
  position: absolute;
  left: 50%; top: 50%; z-index: 6;
  font-family: var(--cf);
  font-weight: 700; letter-spacing: 1.5px;
  font-size: clamp(26px,6.8vw,38px);
  color: var(--gold);
  background: rgba(10,13,11,.92);
  border: 2px solid var(--gold);
  border-radius: 10px;
  padding: 8px 20px;
  white-space: nowrap; pointer-events: none;
  animation: handpop 1.45s ease-out forwards;
}
/* Shift the callout toward the board centre, clear of the turn toast that lands
   on this side the instant the turn flips (your toast ~33% top, dealer ~67%). */
.half.dealer .handpop { top: 84%; }
.half.mine   .handpop { top: 8%; }
.handpop.t3 { color: #ffd97a; border-color: #ffd97a; }
.handpop.t4 { color: #ffe9b0; border-color: #ffe9b0; box-shadow: 0 0 18px rgba(255,233,176,.6); font-size: clamp(30px,8vw,44px); }
.handpop.t5 { color: #fff; border-color: #fff; box-shadow: 0 0 26px rgba(255,255,255,.8); font-size: clamp(34px,9.2vw,50px); }
@keyframes handpop {
  0%   { transform: translate(-50%, -30%) scale(.4); opacity: 0; }
  16%  { transform: translate(-50%, -50%) scale(1.18); opacity: 1; }
  28%  { transform: translate(-50%, -50%) scale(1); }
  78%  { transform: translate(-50%, -50%) scale(1); opacity: 1; }
  100% { transform: translate(-50%, -85%) scale(1); opacity: 0; }
}

/* ─── HAND BREAK: the defender's hand label (identical to .handpop) shatters ─── */
.hbpop { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 8; pointer-events: none; }
/* hbpanel keeps the full .handpop look (incl. tier colours) — just neutralise
   its absolute positioning + float-up animation so it sits inside the shards. */
.hbpanel { position: static; left: auto; top: auto; z-index: auto; transform: none; animation: none; }
.hbpop:not(.shattered) { animation: hbshow .24s cubic-bezier(.3,1.4,.5,1) both; }
@keyframes hbshow {
  0%   { transform: translate(-50%, -50%) scale(.3); opacity: 0; }
  70%  { opacity: 1; }
  100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
}
/* shatter: each shard is a clipped copy of the panel that flies off + spins */
.hbpop.shattered .sizer { visibility: hidden; }
.hbshard { position: absolute; inset: 0; animation: hbshatter .5s ease-in forwards; }
.hbshard .hbpanel { width: 100%; height: 100%; }
@keyframes hbshatter {
  0%   { transform: translate(0,0) rotate(0) scale(1); opacity: 1; }
  15%  { opacity: 1; }
  100% { transform: translate(var(--sx), var(--sy)) rotate(var(--sr)) scale(.82); opacity: 0; }
}

.app.shake { animation: shake .5s ease-out; }
@keyframes shake {
  0%, 100% { transform: translate(0, 0); }
  20% { transform: translate(-4px, 2px); }
  40% { transform: translate(4px, -2px); }
  60% { transform: translate(-3px, -2px); }
  80% { transform: translate(3px, 1px); }
}

/* attack screen shake — intensity scales with the number of cards destroyed */
.board.atkshake.a1 { animation: scrshake1 .32s ease-out; }
.board.atkshake.a2 { animation: scrshake2 .38s ease-out; }
.board.atkshake.a3 { animation: scrshake3 .44s ease-out; }
@keyframes scrshake1 {
  0%,100% { transform: translate(0,0); }
  25% { transform: translate(-2px,1px); } 50% { transform: translate(2px,-1px); } 75% { transform: translate(-1px,1px); }
}
@keyframes scrshake2 {
  0%,100% { transform: translate(0,0); }
  20% { transform: translate(-5px,2px); } 40% { transform: translate(5px,-2px); }
  60% { transform: translate(-4px,-1px); } 80% { transform: translate(4px,2px); }
}
@keyframes scrshake3 {
  0%,100% { transform: translate(0,0); }
  15% { transform: translate(-9px,3px) rotate(-.5deg); } 30% { transform: translate(9px,-3px) rotate(.5deg); }
  45% { transform: translate(-7px,-2px); } 60% { transform: translate(7px,2px) rotate(.4deg); } 80% { transform: translate(-4px,1px); }
}

/* callout banners — full-width tilted flashes, each on screen <0.5s. They
   STACK vertically when more than one fires at once (e.g. HAND BREAK + KILL). */
.callouts {
  position: fixed; left: 0; right: 0; top: 30%;
  z-index: 30; pointer-events: none;
  display: flex; flex-direction: column; align-items: center;
  gap: clamp(8px,2.2dvh,24px);
}
.callout {
  width: 124%;
  text-align: center;
  font-family: var(--cf); font-weight: 700;
  font-size: clamp(34px, 11vw, 92px);
  letter-spacing: clamp(3px,1.1vw,7px);
  color: #fff;
  transform: rotate(-7deg);
  padding: clamp(6px,1.6dvh,16px) 0;
  animation: calloutpop .47s ease-out forwards;
}
.callout.killstreak {
  background: linear-gradient(90deg, transparent, rgba(190,34,26,.94) 14%, rgba(255,120,38,.96) 50%, rgba(190,34,26,.94) 86%, transparent);
  text-shadow: 0 0 20px rgba(255,90,40,.95), 0 4px 0 rgba(0,0,0,.55);
}
.callout.killstreak.triple {
  color: #ffe49a;
  background: linear-gradient(90deg, transparent, rgba(150,28,20,.95) 14%, rgba(255,170,40,.97) 50%, rgba(150,28,20,.95) 86%, transparent);
  text-shadow: 0 0 26px rgba(255,200,60,1), 0 4px 0 rgba(0,0,0,.55);
}
/* HAND BREAK — icy shattered-glass blue */
.callout.handbreak {
  color: #eaf6ff;
  background: linear-gradient(90deg, transparent, rgba(38,86,150,.94) 14%, rgba(96,184,240,.96) 50%, rgba(38,86,150,.94) 86%, transparent);
  text-shadow: 0 0 20px rgba(150,215,255,.95), 0 4px 0 rgba(0,0,0,.55);
}
@keyframes calloutpop {
  0%   { opacity: 0; transform: rotate(-7deg) scale(.55); }
  22%  { opacity: 1; transform: rotate(-7deg) scale(1.1); }
  68%  { opacity: 1; transform: rotate(-7deg) scale(1); }
  100% { opacity: 0; transform: rotate(-7deg) scale(1.03); }
}

/* ─── CARDS ─── */
.cardv {
  position: relative;
  container-type: size;                 /* rank/suit scale to the actual card size */
  background: var(--card);
  border-radius: clamp(5px,1.4vw,10px);
  color: #181818;
  box-shadow: 0 3px 7px rgba(0,0,0,.5);
  overflow: hidden;
  animation: pop .22s ease-out;
}
.cardv.red, .face.front.red { color: var(--redsuit); }
/* rank pinned top-left, suit pinned bottom-right */
.cardv .cr {
  position: absolute; top: 2%; left: 9%;
  font-family: var(--cf); font-weight: 700; line-height: .85;
  font-size: 66cqmin;
}
.cardv .cs {
  position: absolute; bottom: 7%; right: 9%;
  line-height: .8;
  font-size: 74cqmin;
}
.cardv.dying { animation: smash .55s ease-in forwards; }
@keyframes pop {
  from { transform: scale(.4); opacity: 0; }
  to   { transform: scale(1); opacity: 1; }
}
@keyframes landpulse {
  0%   { transform: scale(1); }
  45%  { transform: scale(1.13); }
  100% { transform: scale(1); }
}
/* placement "thunk" bounce — !important overrides the held inline animation */
.cardv.slam { animation: landpulse .26s ease-out !important; }
@keyframes smash {
  0%   { transform: scale(1) rotate(0); filter: none; }
  30%  { transform: scale(1.12) rotate(-7deg); filter: sepia(1) saturate(4) hue-rotate(-40deg); }
  100% { transform: scale(0) rotate(18deg); opacity: 0; filter: sepia(1) saturate(4) hue-rotate(-40deg); }
}

/* ─── ATTACK / DESTRUCTION SEQUENCE (pack VFX + SFX) ─── */
/* only uninvolved bystanders dim — attacker and victims stay full brightness */
.cardv.atk-bystander { filter: brightness(.4) saturate(.7); transition: filter .3s; }
/* attacker: glows + shakes (NO enlargement). !important beats the lingering
   inline placement animation so the shake always plays and never scales up. */
.cardv.atk-attacker {
  z-index: 9; overflow: visible;
  box-shadow: 0 0 20px 5px rgba(255,215,100,.9), 0 0 42px rgba(255,160,50,.7);
  animation: atkshakeglow .08s steps(2) infinite !important;
}
@keyframes atkshakeglow {
  0%   { transform: translate(-1.8px, 1.2px); filter: brightness(1.28); }
  100% { transform: translate(1.8px, -1.2px); filter: brightness(1.12); }
}
/* victims: stay lit, then tear in half */
.cardv.atk-victim { z-index: 8; overflow: visible; }
/* fire tint disabled for now — attacks use the rip only:
.cardv.atk-victim.ph-burn   { filter: saturate(1.5) brightness(1.06); transition: filter .2s; } */
.cardv.atk-victim.ph-rip    { background: transparent; box-shadow: none; }
.cardv.atk-victim.ph-rip > .cr, .cardv.atk-victim.ph-rip > .cs { display: none; }

/* single-shot pack fire sprite, drawn larger than the card */
.fx { position: absolute; inset: -35%; z-index: 10; pointer-events: none; background-repeat: no-repeat; background-position: 0 0; }
.fx-burn   { inset: -55%; background-size: 1200% 100%; animation: spr12 .5s steps(12) 1 forwards; }
@keyframes spr12 { from { background-position-x: 0%; } to { background-position-x: 109.0909%; } }

/* RIP IN HALF: two diagonal halves fly apart and fade */
.riphalf { position: absolute; inset: 0; z-index: 6; background: var(--card); border-radius: inherit; overflow: hidden; color: #181818; }
.cardv.red .riphalf { color: var(--redsuit); }
.riphalf .cr { position: absolute; top: 2%; left: 9%; font-family: var(--cf); font-weight: 700; line-height: .85; font-size: 66cqmin; }
.riphalf .cs { position: absolute; bottom: 7%; right: 9%; line-height: .8; font-size: 74cqmin; }
.riphalf.top { clip-path: polygon(0 0, 100% 0, 100% 100%); animation: rip-top .42s ease-in forwards; }
.riphalf.bot { clip-path: polygon(0 0, 0 100%, 100% 100%); animation: rip-bot .42s ease-in forwards; }
@keyframes rip-top { 0% { transform: translate(0,0) rotate(0); } 100% { transform: translate(48%,-66%) rotate(28deg); opacity: 0; } }
@keyframes rip-bot { 0% { transform: translate(0,0) rotate(0); } 100% { transform: translate(-48%,66%) rotate(-28deg); opacity: 0; } }

/* ─── DRAW FLIGHT & FLIP ─── */
.drawfly {
  width: var(--draww); height: var(--drawh);
  position: relative; perspective: 800px;
  opacity: 0; z-index: 5;
}
.drawfly.go { opacity: 1; animation: fly var(--flyms, .42s) cubic-bezier(.25,.8,.35,1) both; }
@keyframes fly {
  from { transform: translate(var(--dx,-56px), var(--dy,0px)) rotate(-12deg); }
  70%  { transform: translate(2px,-3px) rotate(3deg); }
  to   { transform: translate(0,0) rotate(0deg); }
}
.flipinner {
  position: absolute; inset: 0;
  transform-style: preserve-3d;
  animation: flipover .45s ease-in-out var(--flipdel,.4s) both;
}
@keyframes flipover {
  from { transform: rotateY(180deg); }
  55%  { transform: rotateY(90deg) translateY(-9px) scale(1.1); }
  to   { transform: rotateY(0deg) translateY(0) scale(1); }
}
.face {
  position: absolute; inset: 0;
  border-radius: 9px;
  backface-visibility: hidden; -webkit-backface-visibility: hidden;
  box-shadow: 0 3px 7px rgba(0, 0, 0, .5);
}
.face.front { background: var(--card); color: #181818; overflow: hidden; }
.face.front.red { color: var(--redsuit); }
/* match the COLUMN cards exactly: .cardv uses 66cqmin / 74cqmin of card width
   (= drawh*0.72), so mirror those sizes + positions on the draw card's face. */
.face.front .cr { position: absolute; top: 2%; left: 9%; font-family: var(--cf); font-weight: 700; line-height: .85; font-size: calc(var(--drawh) * 0.4752); }
.face.front .cs { position: absolute; bottom: 7%; right: 9%; line-height: .8; font-size: calc(var(--drawh) * 0.5328); }
.face.back {
  transform: rotateY(180deg);
  box-shadow: 0 3px 7px rgba(0,0,0,.5);
}
/* our own red (dealer) / blue (you) striped card backs */
.face.back.en {
  background:
    repeating-linear-gradient(45deg, rgba(0,0,0,.20) 0 6px, transparent 6px 12px),
    linear-gradient(135deg, #8a2c22, #5a1c16);
  border: 2px solid #e8c98a;
}
.face.back.you {
  background:
    repeating-linear-gradient(45deg, rgba(255,255,255,.12) 0 6px, transparent 6px 12px),
    linear-gradient(135deg, #1f4e78, #102b45);
  border: 2px solid #cfe0ef;
}

/* ─── OVERLAYS ─── */
.overlay {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(5, 22, 18, .84);
  z-index: 10;
  padding: 16px;
}
.overlay.dim { backdrop-filter: blur(2px); }

.panel {
  width: 100%;
  max-width: 380px;
  background: linear-gradient(180deg, #18403a, #0f2e29);
  border: 2px solid #2c6256;
  border-radius: 18px;
  padding: clamp(20px,5vw,30px) clamp(18px,5vw,26px);
  text-align: center;
  box-shadow: 0 18px 50px rgba(0,0,0,.5);
}
.panel h1 {
  font-family: var(--cf);
  font-size: clamp(34px,9vw,52px);
  letter-spacing: 3px;
  margin: 0;
}
.panel h2 {
  font-family: var(--cf);
  font-size: clamp(26px,7vw,38px);
  letter-spacing: 2px;
  margin: 0 0 12px;
}
.tag { color: var(--muted); font-size: clamp(13px,3.6vw,17px); margin: 8px 0 18px; }
.bankline {
  font-family: var(--cf);
  letter-spacing: 1.5px;
  font-size: clamp(14px,3.8vw,18px);
  color: var(--muted);
  margin-bottom: 14px;
}
.bankline b { color: var(--gold); font-size: clamp(20px,5vw,26px); margin-left: 6px; }

/* bet slip: STAKE → PAYOUT */
.slip {
  display: flex; align-items: stretch; justify-content: center;
  gap: clamp(6px,2.5vw,12px);
  margin: 8px 0 10px;
}
.slipcol {
  flex: 1 1 0; max-width: 160px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  padding: clamp(8px,2.4vw,14px) 6px;
  border-radius: 13px;
  background: rgba(0,0,0,.26);
  border: 1.5px solid #2c6256;
}
.slipcol span { font-family: var(--cf); font-weight: 700; font-size: clamp(12px,3.3vw,17px); letter-spacing: 1px; color: var(--muted); }
.slipcol b { font-family: var(--cf); font-weight: 700; font-size: clamp(28px,8.5vw,50px); line-height: 1; color: var(--text); }
.slipcol.win { background: linear-gradient(180deg, rgba(244,198,76,.28), rgba(184,138,46,.08)); border-color: var(--gold); box-shadow: 0 0 18px rgba(244,198,76,.3); }
.slipcol.win span { color: var(--gold-soft); }
.slipcol.win b { color: var(--gold); text-shadow: 0 0 18px rgba(244,198,76,.6); }
.sliparrow { align-self: center; font-size: clamp(22px,6vw,34px); color: var(--gold); }
.winchance {
  font-family: var(--cf); font-weight: 700;
  font-size: clamp(13px,3.6vw,18px); letter-spacing: 1px;
  color: var(--muted); margin-bottom: 14px;
}
.winchance b { color: #6fe39a; margin: 0 3px; }
.chips {
  display: flex;
  justify-content: center;
  gap: clamp(7px,2.4vw,12px);
  margin-bottom: 18px;
}
.clearchip { border-style: solid !important; border-color: #2c6256 !important; color: var(--muted) !important; display: flex; align-items: center; justify-content: center; }
.clearchip .lucide { width: clamp(24px,7vw,34px); height: clamp(24px,7vw,34px); }
.chip {
  width: clamp(58px,16vw,76px); aspect-ratio: 1;
  border-radius: 50%;
  border: 3px dashed var(--gold);
  background: radial-gradient(circle at 35% 30%, #2c6256, #16332d);
  color: var(--gold);
  font-family: var(--cf);
  font-weight: 700;
  font-size: clamp(18px,5vw,24px);
}
.chip:disabled { opacity: .3; }

.dealbtn {
  display: block;
  width: 100%;
  padding: clamp(13px,3.4vw,18px);
  border: none;
  border-radius: 11px;
  background: linear-gradient(180deg, #ffd668, #e8a838);
  color: #2a1c05;
  font-family: var(--cf);
  font-weight: 700;
  font-size: clamp(19px,5.2vw,26px);
  letter-spacing: 2px;
  margin-top: 4px;
  box-shadow: 0 4px 0 #a8721f;
}
.dealbtn:disabled { opacity: .4; box-shadow: 0 4px 0 #5a4318; }
.dealbtn:active { transform: translateY(2px); box-shadow: 0 2px 0 #a8721f; }

.fine { color: var(--muted); font-size: clamp(11px,3vw,14px); margin: 12px 0 0; }
.depositbtn {
  display: inline-block;
  margin: 10px auto 4px;
  padding: clamp(7px,1.8vw,10px) clamp(14px,4vw,22px);
  border-radius: 999px;
  border: 1.5px solid var(--gold-dim);
  background: rgba(244,198,76,.12);
  color: var(--gold);
  font-family: var(--cf); font-weight: 700;
  font-size: clamp(13px,3.6vw,17px);
  letter-spacing: 1.5px;
}
.depositbtn:active { transform: translateY(1px); }
.broke { color: var(--redsuit); font-weight: 700; font-size: clamp(15px,4vw,19px); margin: 16px 0; }
.ruleslink {
  background: none;
  border: none;
  color: var(--muted);
  font-size: clamp(12px,3.2vw,15px);
  letter-spacing: 1.5px;
  margin-top: 16px;
  text-decoration: underline;
}

.result h2 { font-size: clamp(32px,8.5vw,46px); }
.result.win h2 { color: var(--gold); }
.result.lose h2 { color: var(--redsuit); }
.totals {
  display: flex;
  justify-content: center;
  gap: 14px;
  font-family: var(--cf);
  font-size: clamp(16px,4.4vw,21px);
  letter-spacing: 1px;
  color: var(--muted);
  margin-bottom: 10px;
}
.totals b { color: var(--text); font-size: clamp(20px,5.4vw,27px); margin-left: 5px; }
.totals .vs { align-self: center; font-size: clamp(12px,3.2vw,15px); }
.profit {
  font-family: var(--cf);
  font-weight: 700;
  font-size: clamp(30px,8vw,42px);
  margin-bottom: 16px;
}
.result.win .profit { color: var(--gold); }
.result.lose .profit { color: var(--redsuit); }

.rules { text-align: left; max-height: 86dvh; overflow-y: auto; }
.rules h2 { text-align: center; }
.rules p { font-size: clamp(13px,3.6vw,16px); line-height: 1.55; color: #d3ddd6; margin: 0 0 11px; }
.rules .gold { color: var(--gold); }
.rules table {
  width: 100%;
  font-size: clamp(13px,3.6vw,16px);
  border-collapse: collapse;
  margin: 4px 0 12px;
}
.rules td { padding: 4px 6px; border-bottom: 1px solid #224039; }
.rules td:last-child { text-align: right; color: var(--gold); font-weight: 700; }

/* ─── SETTINGS / DEBUG ─── */
.gear { font-size: clamp(17px,4.4vw,23px); }
.settings { text-align: center; max-height: 88dvh; overflow-y: auto; }
.setsec + .setsec { margin-top: 0; }
.setsec { margin: 6px 0 14px; padding: 14px; border: 1px solid #2c6256; border-radius: 14px; background: rgba(0,0,0,.22); }
.setsec h3 { font-family: var(--cf); letter-spacing: 1px; font-size: clamp(14px,3.8vw,18px); color: var(--gold-soft); margin: 0 0 8px; }
.setnote { color: var(--muted); font-size: clamp(12px,3.3vw,15px); margin: 0 0 12px; }
.rankgrid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 10px; }
.rkbtn {
  font-family: var(--cf); font-weight: 700; font-size: clamp(14px,3.8vw,19px);
  padding: 8px 0; border-radius: 8px; color: var(--text);
  background: rgba(255,255,255,.06); border: 1.5px solid #2c6256;
}
.rkbtn.on { background: var(--gold); color: #1a1408; border-color: var(--gold-soft); }
.rkbtn.wide { flex: 1 1 0; max-width: 90px; padding: 12px 0; font-size: clamp(18px,5vw,24px); }
.rkbtn:disabled { opacity: .35; }
.suitrow { display: flex; justify-content: center; gap: 10px; margin-bottom: 14px; }
.stbtn {
  width: clamp(44px,12vw,58px); aspect-ratio: 1; font-size: clamp(22px,6vw,30px);
  border-radius: 10px; color: #1a1408; background: var(--card);
  border: 2px solid #2c6256;
}
.stbtn.red { color: var(--redsuit); }
.stbtn.on { border-color: var(--gold); box-shadow: 0 0 12px rgba(244,198,76,.55); transform: translateY(-1px); }

/* ─── DECK BREAKDOWN ─── */
.deckbreak { max-height: 88dvh; overflow-y: auto; }
.deckbreak .bankline { margin-bottom: 14px; }
.breakgrid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 2px 16px;
  margin-bottom: 16px;
}
.brow {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 4px 4px;
  border-bottom: 1px solid #224039;
}
.brank {
  font-family: var(--cf);
  font-weight: 700;
  font-size: clamp(15px,4vw,19px);
  width: 20px;
  text-align: center;
  color: var(--text);
}
.bsuits { display: flex; gap: 4px; flex: 1; }
.bs { font-size: clamp(14px,3.8vw,18px); color: #d3ddd6; }
.bs.red { color: var(--redsuit); }
.bs.gone { opacity: .16; }
.bcount {
  font-family: var(--cf);
  font-weight: 700;
  font-size: clamp(13px,3.5vw,16px);
  color: var(--gold);
  width: 16px;
  text-align: right;
}

/* ─── WIN CELEBRATION (plays over the board) ─── */
.celebrate { position: fixed; inset: 0; z-index: 20; pointer-events: none; overflow: hidden; }
.confetti, .coinstream { position: absolute; inset: 0; }
.conf {
  position: absolute; left: 50%; top: 46%;
  transform: translate(-50%,-50%) scale(.2);
  opacity: 0;
  will-change: transform, opacity;
  animation: confburst 3.2s cubic-bezier(.12,.7,.35,1) forwards;   /* explosion lasts 2x longer */
}
@keyframes confburst {
  0%   { transform: translate(-50%,-50%) scale(.2) rotate(0deg); opacity: 0; }
  8%   { opacity: 1; }
  85%  { opacity: 1; }
  100% { transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(1.15) rotate(var(--rot)); opacity: 0; }
}
.winburst { position: absolute; left: 50%; top: 42%; transform: translate(-50%,-50%); text-align: center; width: 100%; }
/* radial backdrop so the text reads against the busy board */
.winbg {
  position: absolute; left: 50%; top: 46%; z-index: -1;
  width: min(150vw, 900px); aspect-ratio: 1; transform: translate(-50%,-50%);
  border-radius: 50%; pointer-events: none;
  background: radial-gradient(closest-side, rgba(0,0,0,.95), rgba(0,0,0,.78) 45%, rgba(0,0,0,0) 72%);
  animation: winbgpop .5s both;
}
/* dedicated keyframes that KEEP the centering translate — the shared winpop
   animates `transform`, which would otherwise clobber translate(-50%,-50%)
   and shove the backdrop off to the lower-right of the text. */
@keyframes winbgpop {
  from { transform: translate(-50%,-50%) scale(.3); opacity: 0; }
  to   { transform: translate(-50%,-50%) scale(1);  opacity: 1; }
}
.winbig {
  font-family: var(--cf); font-weight: 700;
  font-size: clamp(54px,17vw,150px); letter-spacing: 2px; line-height: .9;
  color: #fff;
  text-shadow: 0 0 26px var(--gold), 0 5px 0 #a8721f, 0 0 70px rgba(244,198,76,.85);
  animation: winpop .6s cubic-bezier(.2,1.5,.4,1) both;
}
.winamt {
  font-family: var(--cf); font-weight: 700;
  font-size: clamp(34px,10vw,80px); line-height: 1;
  color: var(--gold);
  text-shadow: 0 0 22px rgba(244,198,76,.8);
  animation: winpop .6s .12s cubic-bezier(.2,1.5,.4,1) both;
}
.winpay {
  font-family: var(--cf); font-weight: 700;
  font-size: clamp(16px,4.6vw,28px); letter-spacing: 1px; margin-top: 6px;
  color: var(--gold-soft);
  animation: winpop .6s .22s both;
  transition: opacity .5s;
}
.winpay.sent { opacity: .45; }
@keyframes winpop { from { transform: scale(.3); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.coin {
  position: absolute; left: 50%; top: 50%;
  width: clamp(30px,7vw,54px); height: auto;
  opacity: 0;
  will-change: transform, opacity;
  animation: coindrain .34s ease-in forwards;
  filter: drop-shadow(0 2px 4px rgba(0,0,0,.5));
}
@keyframes coindrain {
  0%   { transform: translate(-50%,-50%) scale(1); opacity: 0; }
  18%  { transform: translate(calc(-50% + var(--jx)), -75%) scale(1.15); opacity: 1; }
  100% { transform: translate(calc(-50% + var(--cx)), calc(-50% + var(--cy))) scale(.35); opacity: 0; }
}

/* ════════════════════ DESKTOP / TABLET (wide) LAYOUT ════════════════════
   Reuses .board / .half / .colscore / .handpop / .deck so every animation
   carries over; only the arrangement is new. Activated by useIsWide(). */
.deskapp {
  width: 100%; max-width: 1520px; min-height: 100dvh; margin: 0 auto;
  /* own stacking context (transparent bg) so the z-index:-1 sunrays sit ABOVE
     the felt background but BEHIND all the app content */
  position: relative; isolation: isolate;
  display: flex; flex-direction: column;
  padding: 12px clamp(14px,2vw,28px) calc(env(safe-area-inset-bottom) + 12px);
  font-family: 'Barlow', sans-serif; color: var(--text);
  user-select: none; -webkit-user-select: none;
  /* one card size for everything — column cards == deck/draw cards. width-based
     so 3 cards × 3 columns + 2 stations always fit across; height follows 5:7. */
  --cardw: clamp(50px, 5.9vw, 92px);  --cardh: calc(var(--cardw) / 0.72);
  --drawh: var(--cardh);              --draww: var(--cardw);
  --scoreh: clamp(44px, 7dvh, 64px);
}
.deskapp.shake { animation: shake .5s ease-out; }

.dtop { position: relative; z-index: 3; display: flex; align-items: center; gap: 16px; padding: 2px; margin-bottom: 10px; }
.dlogo { margin-right: auto; }
.roundpill { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  display: flex; align-items: center; gap: 9px;
  padding: 8px 22px; border: 1px solid rgba(255,255,255,.14); border-radius: 10px;
  background: rgba(0,0,0,.28); font-family: var(--cf); font-weight: 600;
  letter-spacing: 2px; font-size: clamp(13px,1.3vw,16px); color: #cdddd4; }

/* board → three zones: dealer station · center · you station */
.board.deskboard {
  flex: 1; display: grid;
  grid-template-columns: clamp(108px,11.5vw,200px) 1fr clamp(108px,11.5vw,200px);
  grid-template-rows: none; gap: clamp(12px,1.6vw,20px);
  align-items: stretch; justify-content: stretch; padding: 0;
}

.dstation { border-radius: 14px; overflow: hidden; display: flex; flex-direction: column;
  box-shadow: 0 8px 24px rgba(0,0,0,.35), inset 0 0 40px rgba(0,0,0,.22); }
.dstation.en  { background: linear-gradient(180deg,#4a1a18,#2a0f0e); border: 1px solid #7a3029; }
.dstation.you { background: linear-gradient(180deg,#15324f,#0c1f33); border: 1px solid #2d5a82; }
.dsthead { font-family: var(--cf); font-weight: 700; font-size: clamp(18px,1.5vw,23px);
  letter-spacing: 2px; text-align: center; padding: 10px; background: rgba(0,0,0,.25); }
.dsthead.en  { border-bottom: 1px solid rgba(255,120,90,.25); }
.dsthead.you { border-bottom: 1px solid rgba(90,166,224,.3); }
.dstbody { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: clamp(10px,1.6dvh,18px); padding: 16px; }
.dstbody .deck, .dstbody .drawhold { gap: 6px; }

.dcenter { position: relative; display: flex; flex-direction: column; justify-content: center; gap: clamp(4px,0.8dvh,10px); min-width: 0; }
/* columns sit ABOVE the funnel sunrays so the rays only shine behind them.
   extra top margin keeps the dealer total clear of the column letter tabs. */
.dcols { position: relative; z-index: 1; display: flex; gap: clamp(12px,1.6vw,20px);
  align-items: stretch; margin-top: clamp(16px,2.2dvh,24px); }

.dcolumn { position: relative; flex: 1; min-width: 0;
  display: flex; flex-direction: column; align-items: center; gap: clamp(5px,0.8dvh,11px);
  padding: clamp(13px,1.5dvh,19px) clamp(8px,1vw,14px) clamp(9px,1.1dvh,15px);
  border: 1px solid rgba(120,180,160,.28); border-radius: 16px;
  background: linear-gradient(180deg, rgba(90,34,28,.20) 0 50%, rgba(23,58,92,.18) 50% 100%);
  box-shadow: 0 8px 22px rgba(0,0,0,.28); }
.dtab { position: absolute; top: -16px; left: 50%; transform: translateX(-50%);
  width: 74px; height: 34px; background: linear-gradient(180deg,#143f37,#0b2a24);
  border: 1px solid rgba(120,180,160,.45); border-bottom: none;
  clip-path: polygon(8% 0,92% 0,100% 55%,50% 100%,0 55%);
  display: flex; align-items: flex-start; justify-content: center; padding-top: 3px;
  font-family: var(--cf); font-weight: 700; font-size: 21px; color: var(--gold); }

/* desktop card rows run horizontally (portrait stacks them vertically) */
.deskapp .half { flex-direction: row; width: auto; gap: clamp(5px,0.7vw,10px);
  padding: clamp(5px,0.7dvh,9px); border-radius: 11px; }
.deskapp .colscore { height: auto; min-height: var(--scoreh); width: 100%; }
.deskapp .colscore .scoreop { display: none; }
.deskapp .colscore span { font-size: clamp(15px,1.7vw,23px); margin-top: 2px; }

.ddiv { position: relative; width: 84%; height: 0; border-top: 2px solid var(--gold-dim); margin: 1px 0; }
.ddiv::after { content: ""; position: absolute; left: 50%; top: 50%;
  transform: translate(-50%,-50%) rotate(45deg); width: 11px; height: 11px;
  background: var(--gold); box-shadow: 0 0 8px rgba(244,198,76,.5); }

.dfunnel { position: relative; height: clamp(80px,11dvh,98px); }
.dfunnel .dfsvg { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .85; }
/* centre without transform — a transform here would create a stacking context
   that traps the sunrays and stops them sitting behind the rest of the UI */
.dfunnel .dtotwrap { position: absolute; left: 50%; margin-left: calc(clamp(150px,15vw,178px) * -0.5);
  width: clamp(150px,15vw,178px); display: flex; flex-direction: column; align-items: center; }
.dfunnel.en  .dtotwrap { top: 0; }
.dfunnel.you .dtotwrap { bottom: 0; }
/* sunrays sit on a negative layer so they shine BEHIND every other element;
   width 124% (vs the mobile 207%) makes the rays ~40% shorter */
.dfunnel .sunrays { z-index: -1; width: 124%; }
/* label sits just on top of the box (no layout shift when the crown appears) */
.dfunnel .dmk { display: block; font-family: var(--cf); font-weight: 700; font-size: clamp(13px,1.2vw,17px);
  letter-spacing: 2px; color: var(--gold-soft); margin-bottom: 3px; }
.dfunnel .dmedalwrap { position: relative; width: 100%; display: flex; justify-content: center; }
/* tall box — the number is centred, leaving room at the top for the crown (mobile-style) */
.dfunnel .dmedal { position: relative; z-index: 1; width: 100%; height: clamp(58px,8dvh,74px);
  display: flex; align-items: center; justify-content: center; padding: 0 12px;
  background: #0f2c1f; border: 2px solid var(--gold); border-radius: 13px;
  box-shadow: 0 0 18px rgba(244,198,78,.22); }
.dfunnel .dmedal b { font-family: var(--cf); font-weight: 700; font-size: clamp(24px,2.6vw,36px); line-height: .85; color: var(--gold); }
.dfunnel.win .dmedal { box-shadow: 0 0 26px rgba(244,198,78,.5); border-color: var(--gold-soft); }
/* crown perches inside the box's top space — same as the mobile total */
.dfunnel .crown { width: clamp(20px,2.2vw,26px); bottom: auto; top: 2px; margin-bottom: 0; }

.dbot { display: flex; align-items: stretch; gap: clamp(8px,1.4vw,16px); padding: 12px 0 6px; }
.dbot .botbox { min-width: clamp(96px,9vw,130px); }
.dbot .tapbanner { font-size: clamp(18px,2vw,28px); }
</style>
